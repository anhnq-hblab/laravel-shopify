    volumes:
      - ../:/app
    environment:
      - LARAVEL_VERSION=13

  # PHP 8.4 with Laravel 11
  php84-laravel11:
    build:
      context: ..
      dockerfile: docker-testing/Dockerfile.php84
    volumes:
      - ../:/app
    environment:
      - LARAVEL_VERSION=11

  # PHP 8.4 with Laravel 13
