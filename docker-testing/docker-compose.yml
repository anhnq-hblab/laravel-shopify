version: '3.8'

services:
  # PHP 8.1 with Laravel 10
  php81-laravel10:
    build:
      context: ..
      dockerfile: docker-testing/Dockerfile.php81
    volumes:
      - ../:/app
    environment:
      - LARAVEL_VERSION=10

  # PHP 8.1 with Laravel 11
  php81-laravel11:
    build:
      context: ..
      dockerfile: docker-testing/Dockerfile.php81
    volumes:
      - ../:/app
    environment:
      - LARAVEL_VERSION=11

  # PHP 8.2 with Laravel 10
  php82-laravel10:
