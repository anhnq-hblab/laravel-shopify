version: '3.8'

services:
  # PHP 8.1 with Laravel 10
  php81-laravel10:
    build:
      context: ..
      dockerfile: docker-testing/Dockerfile.php81
    volumes:
      - ../:/app
    environment:
      - LARAVEL_VERSION=10.0
    command: ["sh", "-c", "composer require 'illuminate/contracts:10.0' --no-interaction --no-update && composer update --no-interaction && vendor/bin/phpunit -v"]

  # PHP 8.1 with Laravel 11
  php81-laravel11:
